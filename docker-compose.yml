version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - GEMMA_MODEL=${GEMMA_MODEL:-gemma4:e4b}
      - MEDGEMMA_MODEL=${MEDGEMMA_MODEL:-medgemma:4b}
      - FRONTEND_DIR=/app/frontend
      - DB_PATH=/app/data/anamnezai.db
      - RAG_ENABLED=${RAG_ENABLED:-true}
      - OLLAMA_NUM_GPU=${OLLAMA_NUM_GPU:-0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_me_in_production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      # Veritabanını kalıcı tut (container silinse bile kaybolmaz)
      - anamnezai_db:/app/data
      # ChromaDB vektör deposu da kalıcı
      - chroma_data:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  anamnezai_db:
  chroma_data:

# Ollama host makinede çalışıyor (Docker içinde olmak zorunda değil)
# Başlatmak için:
#   cp .env.example .env   # edit with your values
#   docker compose up --build
